# Optional: the app creates config.toml itself (server address + token window on first run).
# Copy to config.toml only to change the other settings.
server_url = "ws://localhost:8000/ws"   # IP of the backend PC if it is another computer; wss:// behind TLS
token = "change-me"                         # = AUTH_TOKEN on the backend
agent_id = ""                               # empty = Windows user name

# Audio. Empty = Windows defaults. Otherwise a part of the device name,
# e.g. line_device = "Jabra" if Zadarma plays the call into a Jabra headset.
mic_device = ""
line_device = ""
mic_gain = 1.0
line_gain = 1.0

# UI
corner = "bottom-right"   # bottom-right | bottom-left | top-right | top-left
hint_seconds = 20
summary_seconds = 45
opacity = 0.96
show_in_taskbar = true   # false = tray icon only

# Call detection (no Zadarma API locally: inferred from audio)
call_end_silence_s = 15
no_line_warning_s = 12
require_zadarma = true
offline_buffer_s = 60
