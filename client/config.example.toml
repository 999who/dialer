# Optional: the app creates config.toml next to itself (the Gemini key window on first run).
# Copy to config.toml only to change the other settings.

# Gemini (also editable in the app: logo -> "Ustawienia (klucz Gemini)")
gemini_api_key = ""                 # aistudio.google.com/apikey
gemini_model = "gemini-3.8-flash"   # cheaper: gemini-3.5-flash-lite
gemini_thinking_level = "low"       # off for 2.5 models

# Knowledge base in Supabase (pgvector). Empty = hints without the knowledge base.
database_url = ""

# Speech recognition (Parakeet on the CPU, downloaded once, ~670 MB)
parakeet_threads = 3
parakeet_model_path = ""            # folder with the model files for PCs without internet

# Audio. Empty = Windows defaults. Otherwise a part of the device name,
# e.g. line_device = "Jabra" if Zadarma plays the call into a Jabra headset.
mic_device = ""
line_device = ""
mic_gain = 1.0
line_gain = 1.0

# UI
corner = "bottom-right"   # bottom-right | bottom-left | top-right | top-left
hint_seconds = 20
summary_seconds = 45
opacity = 0.96
show_in_taskbar = true   # false = tray icon only

# Call detection (no Zadarma API locally: inferred from Zadarma's audio streams in Windows)
call_detect = "zadarma"   # zadarma = by Zadarma's own audio streams; voice = by any sound (old mode)
call_end_silence_s = 15
no_line_warning_s = 12
require_zadarma = true
offline_buffer_s = 60

# EMANAGER CRM: the client card during a call. The operator signs in with their CRM account
# (logo -> "Konto CRM"). The CRM address and its public key are built into the app; set these
# only to use another Supabase project (publishable key only, never a secret one).
# crm_url = ""
# crm_key = ""
crm_sip = ""                  # Zadarma extension of this PC, e.g. "100"; empty = any
own_numbers = "609037902, 525275052"   # company numbers: no client card
