name: Client exe

on:
  push:
    branches: [main]
    paths: ["client/**", "backend/app/**", "backend/models/**", "prompts/**", ".github/workflows/client-exe.yml"]
  pull_request:
    paths: ["client/**", "backend/app/**", "backend/models/**", "prompts/**", ".github/workflows/client-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/requirements.txt

      - name: Install
        working-directory: client
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10" pytest

      - name: Test
        working-directory: client
        run: python -m pytest -q tests

      - name: Build EmanagerDialer.exe
        working-directory: client
        shell: bash
        run: |
          # the commit this exe is built from; the in-app updater compares it with the release
          echo "BUILD = \"$GITHUB_SHA\"" > dialer_client/_build.py
          pyinstaller -y EmanagerDialer.spec

      - name: Cache the Parakeet model for the self-test
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--istupakov--parakeet-tdt-0.6b-v3-onnx
          key: parakeet-tdt-0.6b-v3-int8

      - name: Self-test (built-in backend inside the exe)
        working-directory: client
        shell: pwsh
        env:
          SELFTEST_STT: parakeet   # load the real speech model inside the exe, like on an operator PC
        run: |
          $p = Start-Process dist\EmanagerDialer.exe -ArgumentList "--selftest" -PassThru -Wait
          $tail = Get-Content "$env:LOCALAPPDATA\EMANAGER\EMANAGER Dialer\dialer.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          $tail
          if ($p.ExitCode -ne 0) {
            # annotations are readable through the checks API even where the raw log is not
            $msg = (($tail | Select-Object -Last 15) -join '%0A')
            Write-Output "::error title=selftest log::$msg"
            throw "selftest failed with code $($p.ExitCode)"
          }

      - name: Smoke test (demo mode starts and keeps running)
        working-directory: client
        shell: pwsh
        run: |
          $p = Start-Process dist\EmanagerDialer.exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "EmanagerDialer.exe exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: EmanagerDialer
          path: client/dist/EmanagerDialer.exe

      # Fixed download link that always has the build from main:
      # https://github.com/<owner>/<repo>/releases/download/client-latest/EmanagerDialer.exe
      - name: Publish to the "client-latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete client-latest --cleanup-tag --yes || true
          gh release create client-latest client/dist/EmanagerDialer.exe \
            --target "$GITHUB_SHA" \
            --title "EmanagerDialer.exe (najnowsza wersja)" \
            --notes "Automatyczna kompilacja klienta z gałęzi main, commit $GITHUB_SHA."
